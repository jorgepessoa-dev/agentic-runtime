[project]
name = "generic-agentic-runtime"
version = "0.3.0"
description = "Domain-neutral durable agentic runtime with shadow evolution"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["psycopg>=3.2,<4"]

[project.optional-dependencies]
development = ["psycopg[binary]>=3.2,<4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F"]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "ruff>=0.14,<1",
]
